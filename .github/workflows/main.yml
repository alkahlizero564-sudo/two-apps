name: Build Two APKs
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: app1
            id: com.alkahli.app1
            name: قائد الدفعة
          - dir: app2
            id: com.alkahli.app2
            name: الطلاب
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir www
          cp "$(find apps/${{ matrix.dir }} -name index.html | head -n 1)" www/index.html
          python3 scripts/inject.py
      - name: Capacitor config
        env:
          APP_ID: ${{ matrix.id }}
          APP_NAME: ${{ matrix.name }}
        run: node -e "require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:'www'}))"
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.dir }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}
          path: ${{ matrix.dir }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "build-${{ github.run_number }}" out/*.apk --title "Build ${{ github.run_number }}" --notes "app1.apk و app2.apk"
